# Every pull request and every push to yuu (the branch Render deploys): the checks
# on a clean machine. Nothing here deploys. Once this has run green, render.yaml
# gets `autoDeployTrigger: checksPass` so a red commit never reaches production.
#
# The database is a throwaway postgres:17 (same as tests/docker-compose.yml). CI has
# no secrets and needs none: the tests refuse anything but a local database, and the
# startup env check only runs in `next start`, not in the build. (Modelled on OneLink.)
name: CI

on:
  pull_request:
  push:
    branches: [yuu]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: oneservice_test
          LANG: en_US.utf8
          POSTGRES_INITDB_ARGS: --locale=en_US.UTF-8 --encoding=UTF8
          TZ: Asia/Bangkok
        ports:
          - 55442:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oneservice_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      TZ: Asia/Bangkok
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:55442/oneservice_test
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Unit tests
        run: npm test

      # twice: every migration must be re-runnable (README — legacy reloads re-run them all)
      - name: Migrations (empty database, then again)
        run: npm run db:test:prepare && npm run db:test:prepare

      - name: Database tests
        run: npm run test:db

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Last and slowest. Pointed at the CI database so nothing can reach a real one.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  # gitleaks over every commit. The pinned release binary is checked against its
  # published SHA-256 (gitleaks-action needs a paid licence for org repos).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Gitleaks
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --ignore-gitleaks-allow -v .'
