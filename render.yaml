services:
  - type: web
    name: shdservice
    runtime: node
    region: singapore
    plan: free
    branch: main
    # --include=dev ensures TypeScript/Tailwind (devDependencies) are available for the build
    # db:migrate is idempotent (see scripts/migrate.ts) — safe to run on every deploy
    buildCommand: npm install --include=dev && npm run db:migrate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://izypdfhjbqctbopxhrqq.supabase.co
      # publishable key is client-safe (it is sent to the browser anyway)
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_dAvafH_VnmK7OrlY1cWQEg_iO5M0NxB
      # SSO client id is public
      - key: SSO_CLIENT_ID
        value: cli_6e53e9248bcff7fb
      # SECRETS — set the real values in the Render dashboard (never committed to git)
      - key: CENTRAL_API_KEY
        sync: false
      - key: SSO_CLIENT_SECRET
        sync: false
      # Postgres connection for drizzle (Supabase *Session pooler*, port 5432) — set in the dashboard
      - key: DATABASE_URL
        sync: false
      # Supabase secret key — server-only, used for Storage (attachments / slips)
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Session-cookie signing: the app signs with the STABLE CENTRAL_API_KEY, so
      # SESSION_SECRET is optional. Do NOT use generateValue here — it can rotate
      # on deploys and invalidate every active session. Leave unset, or set one
      # fixed value in the dashboard (sync:false) if you want a dedicated secret.
      - key: SESSION_SECRET
        sync: false
      # emails that are always System Admin (comma-separated) — optional bootstrap
      - key: OWNER_EMAILS
        sync: false
