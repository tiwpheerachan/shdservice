services:
  - type: web
    name: shdservice
    runtime: node
    region: singapore
    plan: free
    branch: main
    # --include=dev ensures TypeScript/Tailwind (devDependencies) are available for the build
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://izypdfhjbqctbopxhrqq.supabase.co
      # publishable key is client-safe (it is sent to the browser anyway)
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_dAvafH_VnmK7OrlY1cWQEg_iO5M0NxB
      # SSO client id is public
      - key: SSO_CLIENT_ID
        value: cli_168eb7414da1a2e2
      # SECRETS — set the real values in the Render dashboard (never committed to git)
      - key: CENTRAL_API_KEY
        sync: false
      - key: SSO_CLIENT_SECRET
        sync: false
      # Supabase secret key — server-only, used to write users/master data (bypasses RLS)
      - key: SUPABASE_SECRET_KEY
        sync: false
      # session-cookie signing secret — Render generates a strong random value
      - key: SESSION_SECRET
        generateValue: true
      # emails that are always System Admin (comma-separated) — optional bootstrap
      - key: OWNER_EMAILS
        sync: false
