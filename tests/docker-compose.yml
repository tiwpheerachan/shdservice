# Throwaway Postgres for tests (npm run db:test:up). tmpfs = wiped on every restart;
# loopback-only port so nothing outside this machine can reach it.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: oneservice_test
      TZ: Asia/Bangkok
      LANG: en_US.UTF-8
    ports:
      - "127.0.0.1:55442:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oneservice_test"]
      interval: 1s
      retries: 30
